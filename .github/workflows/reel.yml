name: Compound Wisdom — reel

on:
  schedule:
    # Two reels/day, 12 hours apart (8:00 AM & 8:00 PM ET). run_reel makes the
    # oldest due-unposted slot, one per run, and a slot stays "due" until it
    # posts (same ET day) — so several catch-up times per slot mean GitHub can
    # drop scheduled runs (it often does) and a reel still goes out.
    # Morning slot (8 AM ET = 12:00 EDT / 13:00 EST UTC):
    - cron: "20 12 * * *"
    - cron: "20 13 * * *"
    - cron: "20 15 * * *"
    - cron: "20 17 * * *"
    # Evening slot (8 PM ET = 00:00 EDT / 01:00 EST UTC next day):
    - cron: "20 0 * * *"
    - cron: "20 1 * * *"
    - cron: "20 2 * * *"
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the reel but do not post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: compound-wisdom-state
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION || 'v25.0' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      EDGE_TTS_VOICE: ${{ vars.EDGE_TTS_VOICE || 'en-US-AndrewNeural' }}
      FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
      FISH_VOICE_ID: ${{ vars.FISH_VOICE_ID }}
      FISH_MODEL: ${{ vars.FISH_MODEL || 's2.1-pro-free' }}
      RESEARCH_USE_GROUNDING: ${{ vars.RESEARCH_USE_GROUNDING || '1' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build + publish the daily reel
        run: python run_reel.py
      - name: Commit updated state
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/calm_money.db
          if git diff --staged --quiet; then echo "no state change"; exit 0; fi
          git commit -m "chore: reel state [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "push attempt $i failed; retrying in 5s"; sleep 5
          done
          echo "could not push state after retries"; exit 1
